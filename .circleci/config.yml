version: 2.1

jobs:
  validate-admin-console:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify admin console files
          command: |
            set -eu
            test -f index.html
            test -f .github/workflows/pages.yml
            grep -Eiq '<!doctype html' index.html
            grep -Eiq '<title[^>]*>.*</title>' index.html
            grep -Eiq '</html>[[:space:]]*$' index.html
            python - <<'PY'
            from html.parser import HTMLParser
            from pathlib import Path

            class ConsoleParser(HTMLParser):
                def __init__(self):
                    super().__init__(convert_charrefs=True)
                    self.errors = []

                def error(self, message):
                    self.errors.append(message)

            source = Path("index.html").read_text(encoding="utf-8")
            parser = ConsoleParser()
            parser.feed(source)
            parser.close()
            if parser.errors:
                raise SystemExit("HTML parsing reported errors: " + "; ".join(parser.errors))
            print(f"HTML parser completed; checked {len(source)} characters.")
            PY
      - run:
          name: Report deployment configuration
          command: |
            echo "CircleCI validation passed."
            echo "GitHub Pages deployment is handled separately by .github/workflows/pages.yml."
            echo "This pipeline does not connect to a live MT5 server or execute trades."

workflows:
  validate-on-push:
    jobs:
      - validate-admin-console
