version: 2.1

jobs:
  validate-admin-console:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Verify admin console and modules
          command: |
            set -eu
            test -s index.html
            test -f .github/workflows/pages.yml
            grep -Eiq '<!doctype html' index.html
            grep -Eiq '<title[^>]*>.*</title>' index.html
            grep -Eiq '</html>[[:space:]]*$' index.html
            for module in overview markets clients trading compliance platform integrations audit; do
              grep -q "id=\"page-$module\"" index.html
            done
            python - <<'PY'
            from html.parser import HTMLParser
            from pathlib import Path

            class ConsoleParser(HTMLParser):
                def __init__(self):
                    super().__init__(convert_charrefs=True)
                    self.errors = []

            source = Path("index.html").read_text(encoding="utf-8")
            parser = ConsoleParser()
            parser.feed(source)
            parser.close()
            print(f"HTML parser completed; checked {len(source)} characters.")
            PY

  validate-javascript:
    docker:
      - image: cimg/node:22.10
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Extract and syntax-check inline JavaScript
          command: |
            set -eu
            node - <<'NODE'
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
              .map(match => match[1])
              .filter(source => source.trim().length > 0);
            if (scripts.length === 0) {
              throw new Error('No inline JavaScript found');
            }
            scripts.forEach((source, index) => {
              fs.writeFileSync('/tmp/cyrrenza-inline-' + (index + 1) + '.js', source);
            });
            console.log('Extracted ' + scripts.length + ' inline script(s).');
            NODE
            for script in /tmp/cyrrenza-inline-*.js; do
              node --check "$script"
            done

workflows:
  validate-on-push:
    jobs:
      - validate-admin-console
      - validate-javascript
